version: "3.8"

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: transunion-parser-dev
    ports:
      - "8000:8000"
    volumes:
      # Mount source code for hot-reload
      - ./src:/app/src
      # Persist logs and backups
      - ./logs:/app/logs
      - ./backups:/app/backups
      - ./temp_uploads:/app/temp_uploads
    environment:
      - PYTHONPATH=/app
      - DEBUG=1
      - MAX_WORKERS=1 # Single worker for development
      - LOG_LEVEL=debug
      - MAX_FILE_SIZE_MB=10
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    # Enable auto-reload for development
    command: uvicorn src.main:app --host 0.0.0.0 --port 8000 --reload

networks:
  default:
    name: transunion-parser-network
