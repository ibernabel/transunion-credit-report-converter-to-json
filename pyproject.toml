[project]
name = "transunion-pdf-to-json"
version = "1.0.0"
description = "Production-ready FastAPI service to parse TransUnion Credit Reports (PDF) into structured JSON with PII scrubbing"
authors = [
    {name = "Idequel Bernabel"}
]
license = {text = "Apache-2.0"}
readme = "README.md"
requires-python = ">=3.12"

dependencies = [
    "fastapi>=0.100.0",
    "uvicorn[standard]>=0.22.0",
    "pydantic[email]>=2.0.0",
    "pymupdf>=1.22.0",
    "unidecode>=1.3.6",
    "python-multipart>=0.0.6",
    # Logging and monitoring dependencies
    "python-json-logger>=2.0.7",
    "psutil>=5.9.0",
    "schedule>=1.2.0",
    "pytest>=9.0.2",
    "httpx>=0.28.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.1",
    "httpx>=0.24.1",
    "mypy>=1.4.1",
    "black>=23.7.0",
    "ruff>=0.1.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]

[tool.ruff]
line-length = 100
select = ["E", "F", "I", "W"]
exclude = [
    ".git",
    "__pycache__",
    ".mypy_cache",
    ".pytest_cache",
    "myenv",
    "frontend/node_modules",
]

[tool.black]
line-length = 100
exclude = '''
/(
    \.git
  | __pycache__
  | \.mypy_cache
  | \.pytest_cache
  | myenv
  | frontend
)/
'''
