[project]
name = "transunion-pdf-to-json"
version = "0.1.0"
description = "Modern FastAPI service to parse Transunion Credit Reports (PDF/Text) into structured JSON"
authors = [
    {name = "Idequel Bernabel"}
]
dependencies = [
    "fastapi>=0.100.0",
    "uvicorn[standard]>=0.22.0",
    "pydantic[email]>=2.0.0",
    "pymupdf>=1.22.0",
    "unidecode>=1.3.6",
    "python-multipart>=0.0.6",
]
requires-python = ">=3.12"

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.1",
    "httpx>=0.24.1",
    "mypy>=1.4.1",
    "black>=23.7.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]
